# For servers where Docker bridge networking is blocked by host firewalls (nftables/Tailscale).
# cp deploy/host-network-override.example.yml docker-compose.override.yml ; also create nginx-host.conf (below)
services:
  backend:
    network_mode: host
    ports: !override []
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "5151"]
  frontend:
    network_mode: host
    ports: !override []
    volumes:
      - ./nginx-host.conf:/etc/nginx/conf.d/default.conf:ro
