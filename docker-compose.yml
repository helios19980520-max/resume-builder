services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped
